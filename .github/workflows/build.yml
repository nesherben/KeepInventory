name: Build KeepInventory APK

on:
  push:
    branches:
      - main
      - master # Por si tu rama principal se llama master

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Acelera compilaciones futuras

      - name: 📦 Instalar dependencias
        run: flutter pub get

      - name: 🔨 Compilar APK
        run: flutter build apk --release

      - name: 🚀 Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: KeepInventory-APK
          # El asterisco pilla automáticamente tu APK renombrado
          path: build/app/outputs/flutter-apk/*.apk